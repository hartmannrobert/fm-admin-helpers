<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Fusion Manage Admin Controls</title>
  </head>
  <body>
    <main class="fmg-popup">
      <header class="fmg-popup__header">
        <div class="fmg-popup__logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 2L15.5 6V12L9 16L2.5 12V6L9 2Z" stroke="white" stroke-width="1.5" fill="none" stroke-linejoin="round" />
            <circle cx="9" cy="9" r="2.5" fill="white" />
          </svg>
        </div>
        <div class="fmg-popup__heading">
          <h1 class="fmg-popup__title">Control Center</h1>
          <p class="fmg-popup__subtitle">Fusion Manage Admin Helpers</p>
        </div>
      </header>

      <section class="fmg-popup__section">
        <div class="fmg-popup__section-label">Features</div>
        <div class="fmg-popup__workflow-list">
          <div class="fmg-popup__admin-row">
            <div>
              <div class="fmg-popup__admin-label">Shortcut Buttons</div>
            </div>
            <input id="opt-buttons" type="checkbox" class="fmg-popup__toggle" />
          </div>
          <div class="fmg-popup__admin-row">
            <div>
              <div class="fmg-popup__admin-label">Administration Helpers</div>
            </div>
            <input id="opt-other" type="checkbox" class="fmg-popup__toggle" />
          </div>
          <div class="fmg-popup__admin-row">
            <div>
              <div class="fmg-popup__admin-label">Workspace Manager Shortcuts</div>
            </div>
            <input id="opt-workspace-shortcuts" type="checkbox" class="fmg-popup__toggle" />
          </div>
        </div>
      </section>

      <section class="fmg-popup__section">
        <button id="btn-close" type="button" class="fmg-popup__btn fmg-popup__btn--full">Close</button>
      </section>

      <footer class="fmg-popup__footer">
        <span class="fmg-popup__footer-link">Fusion Manage Helper · v1.0</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
